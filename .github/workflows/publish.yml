name: Publish to npm

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: false
        type: string
      bump_type:
        description: "Version bump type (patch, minor, major)"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Only run if PR was merged (not closed without merge)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test:coverage

      - name: Build project
        run: bun run build:all

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ] || [ ! -f "dist/index.d.ts" ]; then
            echo "Build output is missing!"
            exit 1
          fi

      - name: Extract version from tag
        if: github.event_name == 'release'
        id: tag_version
        run: |
          # Remove refs/tags/ prefix
          TAG=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG"

      - name: Update package.json version from tag
        if: github.event_name == 'release'
        run: |
          # Remove refs/tags/ prefix
          TAG=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          npm version $VERSION --no-git-tag-version
          echo "Updated package.json version to $VERSION"

      - name: Update package.json version from input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          echo "Updated package.json version to ${{ github.event.inputs.version }}"

      - name: Bump version for PR merge to main
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        id: bump_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Current version in package.json: $CURRENT_VERSION"

          # Try to get latest published version from npm
          # Use registry-url to ensure we're checking the correct registry
          NPM_VERSION=""
          echo "🔍 Checking npm registry for latest published version..."
          if npm view "$PACKAGE_NAME" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            NPM_VERSION=$(npm view "$PACKAGE_NAME" version --registry=https://registry.npmjs.org)
            echo "📌 Latest version on npm: $NPM_VERSION"
            
            # If npm version exists and is different, sync package.json to npm version first
            # This handles the case where a previous publish succeeded but the commit didn't get pushed back
            if [ "$NPM_VERSION" != "$CURRENT_VERSION" ]; then
              echo "🔄 Syncing package.json version from $CURRENT_VERSION to $NPM_VERSION (npm version is newer)"
              # Use node to directly update package.json
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                pkg.version = '$NPM_VERSION';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
              CURRENT_VERSION=$NPM_VERSION
              echo "✅ Updated package.json to version $NPM_VERSION"
            else
              echo "✅ package.json version matches npm version"
            fi
          else
            echo "ℹ️ Package not found on npm (first publish?), using package.json version"
          fi

          echo "📋 Starting version bump from: $CURRENT_VERSION"

          # Determine bump type
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bump_type }}" ]; then
            BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          else
            # Check commit messages for version bump hints
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE "^(feat|feature):"; then
              BUMP_TYPE="minor"
            elif echo "$COMMIT_MSG" | grep -qiE "^(break|breaking):"; then
              BUMP_TYPE="major"
            else
              BUMP_TYPE="patch"
            fi
          fi

          echo "Bump type: $BUMP_TYPE"
          npm version $BUMP_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bumped version from $CURRENT_VERSION to $NEW_VERSION ($BUMP_TYPE)"

      - name: Commit version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.bump_version.outputs.version }}"
            git push origin HEAD:${{ github.event.pull_request.base.ref }}
          fi

      - name: Check if version already exists on npm
        id: check_version
        continue-on-error: true
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "🔍 Checking if $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm..."

          # Check if version exists (use explicit registry URL)
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "⚠️ Version $PACKAGE_VERSION already exists on npm!"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping publish - version already exists"
          else
            echo "✅ Version $PACKAGE_VERSION is available to publish"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.exists != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "🚀 Publishing $PACKAGE_NAME@$PACKAGE_VERSION to npm..."
          npm publish --access public
          echo "✅ Successfully published $PACKAGE_NAME@$PACKAGE_VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish (version exists)
        if: steps.check_version.outputs.exists == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "⏭️ Skipping publish: $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm"
          echo "💡 This is expected if the version was already published in a previous run"

      - name: Get package name and version
        id: package_info
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Published: $PACKAGE_NAME@$PACKAGE_VERSION"
