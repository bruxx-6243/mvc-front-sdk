name: Publish to npm

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: false
        type: string
      bump_type:
        description: "Version bump type (patch, minor, major)"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Only run if PR was merged (not closed without merge)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test:coverage

      - name: Build project
        run: bun run build:all

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ] || [ ! -f "dist/index.d.ts" ]; then
            echo "Build output is missing!"
            exit 1
          fi

      - name: Extract version from tag
        if: github.event_name == 'release'
        id: tag_version
        run: |
          # Remove refs/tags/ prefix
          TAG=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG"

      - name: Update package.json version from tag
        if: github.event_name == 'release'
        run: |
          # Remove refs/tags/ prefix
          TAG=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${TAG#v}
          npm version $VERSION --no-git-tag-version
          echo "Updated package.json version to $VERSION"

      - name: Update package.json version from input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          echo "Updated package.json version to ${{ github.event.inputs.version }}"

      - name: Bump version for PR merge to main
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        id: bump_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          # Get current version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Current version in package.json: $PKG_VERSION"

          # Always get the HIGHEST published version from npm (not just "latest" tag)
          echo "🔍 Checking npm registry for highest published version..."
          BASE_VERSION="$PKG_VERSION"
          
          # Get all versions from npm
          if npm view "$PACKAGE_NAME" versions --json --registry=https://registry.npmjs.org > /tmp/npm-versions.json 2>/dev/null; then
            NPM_VERSIONS_JSON=$(cat /tmp/npm-versions.json)
            echo "📦 Found versions on npm"
            
            # Find the highest semantic version using npm's version comparison
            # npm view can sort versions for us, but we'll do it manually to be safe
            NPM_VERSION=$(node -e "
              try {
                const versions = JSON.parse(process.argv[1]);
                if (!Array.isArray(versions) || versions.length === 0) {
                  console.log('');
                  process.exit(1);
                }
                // Parse and compare semantic versions
                function parseVersion(v) {
                  const parts = v.split('.').map(p => parseInt(p, 10) || 0);
                  return { major: parts[0] || 0, minor: parts[1] || 0, patch: parts[2] || 0, original: v };
                }
                function compareVersions(a, b) {
                  if (a.major !== b.major) return b.major - a.major;
                  if (a.minor !== b.minor) return b.minor - a.minor;
                  return b.patch - a.patch;
                }
                const parsed = versions.map(parseVersion).sort(compareVersions);
                console.log(parsed[0].original);
              } catch (e) {
                console.log('');
                process.exit(1);
              }
            " "$NPM_VERSIONS_JSON")
            
            if [ -z "$NPM_VERSION" ] || [ "$NPM_VERSION" == "null" ]; then
              echo "⚠️ Could not parse versions, trying fallback method..."
              # Fallback: get dist-tags or use version command
              NPM_VERSION=$(npm view "$PACKAGE_NAME" version --registry=https://registry.npmjs.org 2>/dev/null || echo "")
              if [ -z "$NPM_VERSION" ]; then
                echo "ℹ️ Package not found on npm, using package.json version: $PKG_VERSION"
                BASE_VERSION="$PKG_VERSION"
              else
                echo "📌 Using npm 'latest' tag version (fallback): $NPM_VERSION"
                BASE_VERSION="$NPM_VERSION"
              fi
            else
              echo "📌 Highest semantic version on npm: $NPM_VERSION"
              
              # Always sync package.json to highest npm version first
              if [ "$NPM_VERSION" != "$PKG_VERSION" ]; then
                echo "🔄 Syncing package.json from $PKG_VERSION to $NPM_VERSION"
                node -e "
                  const fs = require('fs');
                  const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                  pkg.version = '$NPM_VERSION';
                  fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                "
                BASE_VERSION="$NPM_VERSION"
                echo "✅ Synced package.json to npm highest version: $NPM_VERSION"
              else
                echo "✅ package.json already matches npm highest version"
                BASE_VERSION="$NPM_VERSION"
              fi
            fi
            rm -f /tmp/npm-versions.json
          else
            echo "ℹ️ Package not found on npm (first publish?), using package.json version: $PKG_VERSION"
            BASE_VERSION="$PKG_VERSION"
          fi

          echo "📋 Will bump from base version: $BASE_VERSION"

          # Determine bump type
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bump_type }}" ]; then
            BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          else
            # Check commit messages for version bump hints
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE "^(feat|feature):"; then
              BUMP_TYPE="minor"
            elif echo "$COMMIT_MSG" | grep -qiE "^(break|breaking):"; then
              BUMP_TYPE="major"
            else
              BUMP_TYPE="patch"
            fi
          fi

          echo "🔢 Bump type: $BUMP_TYPE"

          # Verify current version before bump
          BEFORE_BUMP=$(node -p "require('./package.json').version")
          echo "📋 Version before bump: $BEFORE_BUMP"

          if [ "$BEFORE_BUMP" != "$BASE_VERSION" ]; then
            echo "⚠️ Warning: package.json version ($BEFORE_BUMP) doesn't match base version ($BASE_VERSION)"
            echo "🔄 Updating to base version first..."
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$BASE_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            BEFORE_BUMP="$BASE_VERSION"
          fi

          # Perform the version bump
          echo "🚀 Running: npm version $BUMP_TYPE --no-git-tag-version"
          npm version $BUMP_TYPE --no-git-tag-version || {
            echo "❌ Failed to bump version"
            echo "Current package.json content:"
            cat package.json | grep -A 2 '"version"'
            exit 1
          }

          # Verify the bump worked
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "✅ Bumped version from $BEFORE_BUMP to $NEW_VERSION ($BUMP_TYPE)"

          # Double-check the version is actually different
          if [ "$NEW_VERSION" == "$BEFORE_BUMP" ]; then
            echo "❌ ERROR: Version did not change! Still $NEW_VERSION"
            exit 1
          fi

      - name: Verify version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          FINAL_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_VERSION="${{ steps.bump_version.outputs.version }}"
          echo "🔍 Verifying version bump..."
          echo "Expected version: $EXPECTED_VERSION"
          echo "Actual version in package.json: $FINAL_VERSION"

          if [ "$FINAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ Version mismatch! Expected $EXPECTED_VERSION but got $FINAL_VERSION"
            exit 1
          fi
          echo "✅ Version verified: $FINAL_VERSION"

      - name: Commit version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local pull.rebase false

          # Get the base branch (usually main or master)
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "📝 Committing version bump to $BASE_BRANCH"

          git add package.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "⚠️ No version changes to commit (version may already be correct)"
          else
            NEW_VERSION=$(node -p "require('./package.json').version")
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            
            # Fetch latest and rebase to avoid conflicts
            git fetch origin $BASE_BRANCH
            git rebase origin/$BASE_BRANCH || {
              echo "⚠️ Rebase conflict, trying merge instead"
              git rebase --abort || true
              git merge origin/$BASE_BRANCH || {
                echo "⚠️ Merge conflict, version bump commit may need manual resolution"
                exit 0  # Don't fail the workflow, version bump is committed locally
              }
            }
            
            # Push the version bump commit
            git push origin HEAD:$BASE_BRANCH || {
              echo "⚠️ Failed to push version bump (may already be pushed or need manual intervention)"
              # Don't fail the workflow - the version is bumped locally and will be published
            }
            echo "✅ Version bump committed and pushed"
          fi

      - name: Check if version already exists on npm
        id: check_version
        continue-on-error: true
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "🔍 Checking if $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm..."

          # Check if version exists (use explicit registry URL)
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "⚠️ Version $PACKAGE_VERSION already exists on npm!"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping publish - version already exists"
          else
            echo "✅ Version $PACKAGE_VERSION is available to publish"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.exists != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "🚀 Publishing $PACKAGE_NAME@$PACKAGE_VERSION to npm..."
          npm publish --access public
          echo "✅ Successfully published $PACKAGE_NAME@$PACKAGE_VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish (version exists)
        if: steps.check_version.outputs.exists == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "⏭️ Skipping publish: $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm"
          echo "💡 This is expected if the version was already published in a previous run"

      - name: Get package name and version
        id: package_info
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Published: $PACKAGE_NAME@$PACKAGE_VERSION"
